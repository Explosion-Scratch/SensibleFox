name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Add Rust Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Full build (online PKGs + DMG)
        # SKIP_OFFLINE=1 skips the ~200MB Firefox-bundled offline PKG;
        # online PKGs + standalone DMG still exercise every build path.
        # No signing identities: scripts fall back to ad-hoc signatures.
        run: SKIP_OFFLINE=1 ./scripts/build.sh

      - name: Verify dist artifacts
        run: ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: sensiblefox-dist
          path: dist/
          if-no-files-found: error

  release:
    # Automatic GitHub release on version tags: `git tag v1.2.3 && git push origin v1.2.3`
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sensiblefox-dist
          path: dist/

      - name: Create release with artifacts + unsigned-install guide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --title "$TAG" --generate-notes
          { gh release view "$TAG" --json body --jq '.body'; echo; cat .github/release-notes-footer.md; } > /tmp/notes.md
          gh release edit "$TAG" --notes-file /tmp/notes.md
          gh release upload "$TAG" dist/SensibleFox-*.pkg dist/SensibleFox.dmg dist/sensiblefox-universal dist/sensiblefox-aarch64 dist/sensiblefox-x86_64 --clobber
